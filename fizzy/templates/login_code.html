{% extends "base.html" %}
{% block title %}Code · Fizzy{% endblock %}
{% block body %}
<section class="gate">
  <p class="kicker">{{ email }}</p>
  <h1>Your code is {{ code }}</h1>
  <p>Fizzy would mail this. Here it stays on the machine that has the database.</p>
  <form method="post" action="/login/code" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Code <input name="code" value="{{ code }}" required autocomplete="one-time-code"></label>
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
